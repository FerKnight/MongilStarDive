<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mongil: Star Dive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <style>
        body { font-family: system-ui, sans-serif; }
        .hero { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
        .sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.open { transform: translateX(0); }
        @media (max-width: 1024px) {
            .sidebar { position: fixed; top: 0; left: -100%; width: 85%; height: 100vh; background: #111827; z-index: 60; box-shadow: 4px 0 20px rgba(0,0,0,0.6); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200">

    <!-- HEADER clickable -->
    <header class="hero text-white py-16 text-center">
        <div class="max-w-6xl mx-auto px-6">
            <h1 onclick="window.location.href='index.html'" class="text-6xl font-bold mb-2 tracking-tight cursor-pointer">MongilStarDive</h1>
        </div>
    </header>

    <!-- BOTÓN DE MENÚ FLOTANTE MEJORADO -->
    <button onclick="toggleSidebar()" id="menu-btn" 
        class="lg:hidden fixed top-4 left-4 bg-gray-900 text-white p-5 rounded-2xl shadow-2xl z-50 text-4xl hover:scale-110 transition">
        ☰
    </button>

    <!-- BARRA LATERAL (solo menús) -->
    <div id="sidebar" class="sidebar fixed top-0 left-0 w-80 h-full bg-gray-900 p-8 overflow-y-auto shadow-2xl z-50 hidden lg:block">
        <nav class="space-y-2">
            <a href="index.html" onclick="closeSidebar()" class="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 rounded-2xl text-xl">Inicio</a>
            <a href="equipamientos.html" onclick="closeSidebar()" class="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 rounded-2xl text-xl">Equipamientos</a>
            <a href="monsterlings.html" onclick="closeSidebar()" class="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 rounded-2xl text-xl">Monsterlings</a>
            <a href="artefactos.html" onclick="closeSidebar()" class="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 rounded-2xl text-xl">Artefactos</a>
        </nav>
    </div>

    <!-- ÚNICO RECUADRO - DATOS DEL JUGADOR -->
    <div class="flex-1 lg:ml-80 px-6 py-12 flex justify-center">
        <div class="bg-gray-900 p-12 rounded-3xl max-w-2xl w-full">

            <!-- CÍRCULO -->
            <div onclick="toggleCharacterMenu()" 
                class="w-48 h-48 mx-auto rounded-full bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center text-8xl cursor-pointer hover:scale-105 transition shadow-2xl">
                👤
            </div>

            <!-- MENÚ DE PERSONAJES -->
            <div id="character-menu" class="hidden mt-8 bg-gray-950 p-6 rounded-3xl">
                <h3 class="text-xl font-bold mb-4 text-center">Selecciona tu personaje</h3>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="selectCharacter(this)" class="character-btn p-6 bg-gray-800 rounded-2xl text-5xl hover:scale-110 transition">Flare</button>
                    <button onclick="selectCharacter(this)" class="character-btn p-6 bg-gray-800 rounded-2xl text-5xl hover:scale-110 transition">Esther</button>
                    <button onclick="selectCharacter(this)" class="character-btn p-6 bg-gray-800 rounded-2xl text-5xl hover:scale-110 transition">Narae</button>
                    <button onclick="selectCharacter(this)" class="character-btn p-6 bg-gray-800 rounded-2xl text-5xl hover:scale-110 transition">Mina</button>
                </div>
            </div>

            <!-- RECUADRO ID DEL JUGADOR -->
            <div class="mt-8">
                <label class="block text-xl font-bold mb-3">ID dentro del juego</label>
                <input id="player-id" type="text" placeholder="Ingresa tu ID" 
                    class="w-full bg-gray-950 p-6 rounded-2xl text-2xl focus:outline-none focus:ring-2 focus:ring-green-400">
            </div>

            <!-- RECUADRO CÓDIGO DE AMISTAD -->
            <div class="mt-8">
                <label class="block text-xl font-bold mb-3">Código de amistad</label>
                <input id="friend-code" type="text" placeholder="Ingresa tu código" 
                    class="w-full bg-gray-950 p-6 rounded-2xl text-2xl focus:outline-none focus:ring-2 focus:ring-green-400">
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-black py-12 text-center text-gray-500">
        <p>Guía 100% original y exclusiva • Octubre 2026 • Creada para ti 🔥</p>
        <p class="mt-4">¡Comparte y dale estrellas a tu repositorio!</p>
    </footer>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('menu-btn');
            sidebar.classList.toggle('hidden');
            if (!sidebar.classList.contains('hidden')) btn.style.display = 'none';
            else btn.style.display = 'block';
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.add('hidden');
            document.getElementById('menu-btn').style.display = 'block';
        }
        function toggleCharacterMenu() {
            const menu = document.getElementById('character-menu');
            menu.classList.toggle('hidden');
        }
        function selectCharacter(btn) {
            document.querySelectorAll('.character-btn').forEach(b => b.classList.remove('active', 'ring-2', 'ring-green-400'));
            btn.classList.add('active', 'ring-2', 'ring-green-400');
            toggleCharacterMenu();
        }
    </script>
</body>
</html>
