<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sección de Monstruitos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

    <!-- SECCIÓN DE MONSTRUITOS -->
    <section id="seccion-monstruitos" class="w-full max-w-4xl mx-auto px-4 py-8">
        <div class="mb-6">
            <h2 class="text-2xl font-black text-amber-500 uppercase tracking-wide">Listado de Monstruitos</h2>
            <p class="text-sm text-slate-400">Selecciona una o varias regiones de forma combinable o busca por nombre o número.</p>
        </div>

        <!-- Contenedor Principal -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex flex-col h-[700px]">
            
            <!-- Buscador -->
            <div class="p-4 border-b border-slate-800 bg-slate-900/90">
                <input type="text" id="searchInput" placeholder="Buscar por nombre o #nro..." class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
            </div>

            <!-- Filtros de Región Combinables -->
            <div class="px-4 py-3 bg-slate-950/50 border-b border-slate-800 flex gap-2 overflow-x-auto whitespace-nowrap text-xs" id="regionFilters">
                <button onclick="toggleRegion('All')" data-region="All" class="region-btn px-3.5 py-2 bg-amber-600 font-bold rounded-lg text-white shrink-0 transition shadow-md shadow-amber-900/30">Todas</button>
                <button onclick="toggleRegion('Elendor')" data-region="Elendor" class="region-btn px-3.5 py-2 bg-slate-800 text-slate-300 rounded-lg shrink-0 transition">Elendor</button>
                <button onclick="toggleRegion('Varhine')" data-region="Varhine" class="region-btn px-3.5 py-2 bg-slate-800 text-slate-300 rounded-lg shrink-0 transition">Varhine</button>
                <button onclick="toggleRegion('Serenia')" data-region="Serenia" class="region-btn px-3.5 py-2 bg-slate-800 text-slate-300 rounded-lg shrink-0 transition">Serenia</button>
                <button onclick="toggleRegion('Surah')" data-region="Surah" class="region-btn px-3.5 py-2 bg-slate-800 text-slate-300 rounded-lg shrink-0 transition">Surah</button>
                <button onclick="toggleRegion('Namryung')" data-region="Namryung" class="region-btn px-3.5 py-2 bg-slate-800 text-slate-300 rounded-lg shrink-0 transition">Namryung</button>
                <button onclick="toggleRegion('Muwon')" data-region="Muwon" class="region-btn px-3.5 py-2 bg-slate-800 text-slate-300 rounded-lg shrink-0 transition">Muwon</button>
                <button onclick="toggleRegion('Sector 3')" data-region="Sector 3" class="region-btn px-3.5 py-2 bg-slate-800 text-slate-300 rounded-lg shrink-0 transition">Sector 3</button>
            </div>

            <!-- Lista Dinámica de Monstruitos -->
            <div id="monsterList" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Se llena automáticamente con JS -->
            </div>
        </div>
    </section>

    <!-- MOTOR DE REGISTRO DINÁMICO -->
    <script>
        const monsterlingsDatabase = [];

        window.registrarRegion = function(nombreRegion, monstruitosArray) {
            monstruitosArray.forEach(m => {
                monsterlingsDatabase.push({
                    region: nombreRegion,
                    nro: m.nro,
                    name: m.name,
                    effect: m.effect || '-',
                    chain: m.chain || '-'
                });
            });
        };
    </script>

    <!-- Carga de archivos divididos por región -->
    <script src="js/data/elendor.js"></script>
    <script src="js/data/varhine.js"></script>
    <script src="js/data/serenia.js"></script>
    <script src="js/data/surah.js"></script>
    <script src="js/data/namryung.js"></script>
    <script src="js/data/muwon.js"></script>
    <script src="js/data/sector3.js"></script>

    <!-- LÓGICA DE INTERFAZ Y FILTROS -->
    <script>
        let selectedRegions = ['All'];

        function toggleRegion(regionName) {
            if (regionName === 'All') {
                selectedRegions = ['All'];
            } else {
                if (selectedRegions.includes('All')) {
                    selectedRegions = [];
                }

                const index = selectedRegions.indexOf(regionName);
                if (index > -1) {
                    selectedRegions.splice(index, 1);
                } else {
                    selectedRegions.push(regionName);
                }

                if (selectedRegions.length === 0) {
                    selectedRegions = ['All'];
                }
            }

            updateFilterButtonsUI();
            renderList();
        }

        function updateFilterButtonsUI() {
            document.querySelectorAll('#regionFilters button').forEach(btn => {
                const reg = btn.getAttribute('data-region');
                if (selectedRegions.includes(reg)) {
                    btn.className = "region-btn px-3.5 py-2 bg-amber-600 font-bold rounded-lg text-white shrink-0 transition shadow-md shadow-amber-900/30";
                } else {
                    btn.className = "region-btn px-3.5 py-2 bg-slate-800 text-slate-300 rounded-lg shrink-0 transition hover:bg-slate-700";
                }
            });
        }

        function renderList() {
            const container = document.getElementById('monsterList');
            container.innerHTML = '';
            const search = document.getElementById('searchInput').value;

            // Filtrado combinable y orden numérico ascendente estricto automático
            const filtered = monsterlingsDatabase.filter(m => {
                const matchRegion = selectedRegions.includes('All') || selectedRegions.includes(m.region);
                const matchSearch = m.name.toLowerCase().includes(search.toLowerCase()) || m.nro.includes(search);
                return matchRegion && matchSearch;
            }).sort((a, b) => parseInt(a.nro) - parseInt(b.nro));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-12 text-sm">No se encontraron resultados</div>`;
                return;
            }

            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800/80 rounded-xl p-4 hover:border-amber-500/50 transition cursor-pointer text-xs shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-mono font-bold text-amber-500 text-sm">#${m.nro}</span>
                        <span class="text-[10px] uppercase px-2.5 py-0.5 bg-slate-900 text-slate-300 rounded-md border border-slate-800 font-semibold">${m.region}</span>
                    </div>
                    <h4 class="font-bold text-slate-100 capitalize text-sm mb-1">${m.name}</h4>
                    <p class="text-slate-400"><strong class="text-slate-300">Efecto:</strong> ${m.effect}</p>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderList();
        });

        // Inicializar listado automáticamente al cargar la página
        renderList();
    </script>
</body>
</html>
